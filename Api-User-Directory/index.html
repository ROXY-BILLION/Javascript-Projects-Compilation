<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>API User Directory</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>API User Directory</h1>
            <p>Load users from an API and display them on the page.</p>
        </header>

        <section class="controls">

            <button id="loadUsers">
                Load Users
            </button>

            <p id="status">Click the button to load users.</p>

        </section>

        <section id="usersContainer" class="users-container">
            <!-- User cards will be added here -->
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
