<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Information</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>My Information</h1>
        <p class="subtitle">This is my personal information</p>

        <section class="card">

            <div class="cover"></div>

            <div class="profile">
                <div class="avatar"><img src="images/profile.jpg" alt=""></div>

                <h2>Okeke Divine Gift</h2>
                <p class="profession">Software Engineer</p>
            </div>

            <div class="details">

                <div class="detail">
                    <span class="icon"><img src="images/profile.jpg" alt=""></span>
                </div>

                <div class="detail">
                    <span class="icon"></span>
                    <span class="label">Age</span>
                    <span>22</span>
                </div>

                <div class="detail">
                    <span class="icon"></span>
                    <span class="label">Profession</span>
                    <span>Software Engineer</span>
                </div>

                <div class="detail">
                    <span class="icon"></span>
                    <span class="label">Country</span>
                    <span>Nigeria</span>
                </div>

            </div>

            <div class="quote">
                "I am passionate about building amazing web applications
                and learning new technologies."
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
