<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Counter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="counter-app">

        <!-- Header -->
        <header class="counter-header">
            <h1>Interactive Counter</h1>
            <p>Increase, decrease or reset the counter</p>
        </header>


        <!-- Counter Display -->
        <section class="counter-display">

            <span id="count">0</span>

            <p>The current count</p>

        </section>


        <!-- Counter Controls -->
        <section class="counter-controls">

            <button id="increase-btn">
                Increase
            </button>

            <button id="decrease-btn">
                Decrease
            </button>

            <button id="reset-btn">
                Reset
            </button>

        </section>


        <!-- Information -->
        <aside class="counter-info">

            <span>Nb</span>

            <p>
                Increase the count, decrease the count
                or reset to zero.
            </p>

        </aside>

    </main>

    <script src="script.js"></script>

</body>

</html>
