<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notes App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>My Notes</h1>
            <p>Create and save your notes.</p>
        </header>

        <form id="noteForm" class="note-form">

            <input
                type="text"
                id="noteInput"
                placeholder="Write a note..."
            >

            <button type="submit">
                Add Note
            </button>

        </form>

        <section id="notesContainer" class="notes-container">
            <!-- Notes will be created here -->
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
